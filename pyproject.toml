[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-quality-cli"
version = "0.1.0"
description = "A small, dependency-free CSV data quality validator for portfolio and learning."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Artur Moreira de Carvalho" }]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["data_quality_cli"]

[tool.pytest.ini_options]
addopts = "-q"
